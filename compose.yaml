# A fixed project name gives the database volume the same name in each checkout directory.
name: festival-playlist-maker

services:
  app:
    build: .
    image: festival-playlist-maker
    ports:
      - "3000:3000"
    volumes:
      - database:/data
    restart: unless-stopped
    environment:
      SPOTIFY_CLIENT_ID: ${SPOTIFY_CLIENT_ID:?}
      ADMIN_SPOTIFY_USER_ID: ${ADMIN_SPOTIFY_USER_ID:?}
      SPOTIFY_REDIRECT_URI: ${SPOTIFY_REDIRECT_URI:-}
      CLASHFINDER_USERNAME: ${CLASHFINDER_USERNAME:?}
      CLASHFINDER_PRIVATE_KEY: ${CLASHFINDER_PRIVATE_KEY:?}
      MUSICBRAINZ_CONTACT: ${MUSICBRAINZ_CONTACT:?}
volumes:
  database:
